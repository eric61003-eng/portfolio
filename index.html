<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="description" content="Eric Chen, spatial, event and visual work for brands in Taipei.">
<title>Eric Chen — Portfolio</title>
<link rel="stylesheet" href="fonts.css">
<script>try{if(localStorage.getItem("theme")==="light")document.documentElement.classList.add("light")}catch(e){}</script>
<style>
:root{
  --black:#000;--bone:#ece8df;--ash:#8d897f;--rule:#2b2a27;
  --pad:clamp(18px,3.2vw,48px);--gap:clamp(6px,.8vw,12px);
  --sans:"Archivo","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--black);color-scheme:dark;overflow-x:clip}
body{overflow-x:clip}
h1,h2{text-wrap:balance;overflow-wrap:break-word;min-width:0}
::selection{background:var(--bone);color:var(--black)}
a,button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--black);color:var(--bone);font-family:var(--sans);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
img,video{display:block;width:100%;height:100%;object-fit:cover;background:#0c0c0c}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a:focus-visible,button:focus-visible{outline:2px solid var(--bone);outline-offset:3px}
[hidden]{display:none!important}
.skip{position:fixed;left:var(--pad);top:-60px;z-index:30;background:var(--bone);color:var(--black);padding:10px 14px;font-size:14px}
.skip:focus{top:12px}
html.lock,html.lock body{overflow:hidden;height:100%}

/* slow zoom, used on hero, tiles and case images */
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.04)}}
.zoom{overflow:hidden}
.zoom > img,.zoom > video{animation:drift 9s ease-in-out infinite alternate;will-change:transform}

/* top bar */
.bar{position:fixed;inset:0 0 auto 0;z-index:20;display:flex;justify-content:space-between;align-items:baseline;padding:18px calc(var(--pad) + 56px) 18px var(--pad);mix-blend-mode:difference;transition:padding .4s ease;pointer-events:none}
.bar a{pointer-events:auto}
.bar .name{font-stretch:125%;font-weight:500;font-size:15px;letter-spacing:.01em}
.bar nav{display:flex;gap:clamp(14px,2.4vw,34px);font-stretch:88%;font-size:14px}
.bar nav a{opacity:.82}.bar nav a:hover{opacity:1}

/* hero marquee: photos run sideways; hover dims the rest and stops the run */
.reel{height:100svh;min-height:520px;display:flex;flex-direction:column;justify-content:center;padding-top:56px;overflow:hidden;position:relative}
.reel .row{display:flex;gap:var(--gap);width:max-content;will-change:transform}
.reel .item{display:block;flex:none;width:calc(var(--ar) * var(--rh));transition:opacity .45s cubic-bezier(.16,1,.3,1)}
.reel .ph{height:var(--rh);overflow:hidden}
.reel .meta{display:flex;font-size:13px;justify-content:flex-start;gap:10px;padding-top:9px;font-stretch:88%;font-size:14px;min-height:44px}
.reel .meta b{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reel .meta span{color:var(--ash);font-variant-numeric:tabular-nums}
/* at rest every photo is grey; the one under the pointer comes up in colour */
.reel .ph img{filter:grayscale(1) brightness(.62);transition:filter .5s cubic-bezier(.16,1,.3,1),transform .9s cubic-bezier(.16,1,.3,1)}
.reel .meta{color:var(--ash);transition:color .4s}
.reel .item:is(:hover,:focus-visible) .ph img{filter:none}
.reel .item:is(:hover,:focus-visible) .meta,.reel .item:is(:hover,:focus-visible) .meta b{color:var(--bone)}
.reel .meta b{color:var(--ash);font-weight:500}
@media (hover:none){.reel .ph img{filter:grayscale(.15) brightness(.9)}}
.reel .item:is(:hover,:focus-visible) img{transform:scale(1.03)}
.reel{--rh:min(52svh,calc((100vw - 2 * var(--pad)) * .36))}
.reel.m1{--rh:min(30svh,17vw)}
.reel.m2{--rh:min(26svh,14vw)}
.reel.m3{--rh:min(19svh,10.5vw)}
.reel .rows{gap:var(--gap)}
.reel .rows{display:flex;flex-direction:column}
.cap{position:absolute;left:50%;top:clamp(64px,8svh,96px);translate:-50% 0;z-index:6;white-space:nowrap;min-height:44px;display:flex;align-items:baseline;gap:14px;opacity:0;transform:translateY(6px);transition:opacity .35s cubic-bezier(.16,1,.3,1),transform .35s cubic-bezier(.16,1,.3,1);pointer-events:none}
.cap.on{opacity:1;transform:none}
/* after 3 s on a photo it grows to the middle of the screen; the rest blurs */
.reel .rows{transition:filter .6s cubic-bezier(.16,1,.3,1)}
.reel.zoomed .rows{filter:blur(10px) brightness(.45)}
.zoomer{display:block;position:fixed;z-index:5;pointer-events:none;overflow:hidden;opacity:0;visibility:hidden}
.reel.zoomed .zoomer{pointer-events:auto;cursor:pointer}
.zoomer img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.1s ease}
.zoomer img.on{opacity:1}
.cap b{font-weight:600;font-stretch:68%;font-size:clamp(26px,2.6vw,40px);line-height:1}
.cap span{font-stretch:88%;font-size:14px;color:var(--ash);font-variant-numeric:tabular-nums}
.pause{position:absolute;right:var(--pad);bottom:clamp(14px,2.4vw,28px);min-height:44px;padding:0 2px;font-stretch:88%;font-size:13px;color:var(--ash)}
.pause:hover{color:var(--bone)}

/* domain entries */
.domains{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(26px,3vw,44px) var(--gap);padding:0 var(--pad);scroll-margin-top:80px}
.dom{display:block;position:relative}
.dom .ph{aspect-ratio:4/3;width:100%;overflow:hidden}
.dom .t{display:flex;justify-content:center;text-align:center;padding-top:12px}
.dom .t b{font-family:'Syne',var(--sans);font-weight:600;font-stretch:100%;font-size:clamp(20px,1.85vw,27px);line-height:1.1}
.dom .t span{font-stretch:88%;font-size:14px;color:var(--ash)}

/* domain entries cycle through their work */
.dom .ph{position:relative}
.dom .ph .sl{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease}
.dom .ph .sl.on{opacity:1}
.dom .ph .sl.on > img{animation:drift 9s ease-in-out infinite alternate}
.dom .mk{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.dom .mk img{width:auto;height:auto;max-width:42%;max-height:26%;object-fit:contain;background:none;filter:brightness(0) invert(1);animation:none}
.dom .mk b{font-weight:600;font-stretch:68%;font-size:clamp(24px,2.4vw,36px);color:var(--bone)}

/* brand wall: white logos; the brand's work fades in behind on hover */
.grid.logos{grid-template-columns:repeat(4,minmax(0,1fr))}
.logo-tile .ph{aspect-ratio:3/2;position:relative;background:#0b0b0b;overflow:hidden}
.logo-tile .bg{position:absolute;inset:0;opacity:0;transition:opacity .6s cubic-bezier(.16,1,.3,1)}
.logo-tile .bg img{filter:brightness(.42);transform:scale(1.03);transition:transform 1.2s cubic-bezier(.16,1,.3,1)}
.logo-tile .mark{position:absolute;inset:0;display:grid;place-items:center;transition:opacity .4s}
.logo-tile .mark img{height:auto;max-height:58%;object-fit:contain;background:none;opacity:.8;transition:opacity .4s}
.logo-tile .mark b{font-weight:600;font-stretch:68%;font-size:clamp(18px,1.7vw,26px);letter-spacing:.06em;color:var(--bone);opacity:.78;text-transform:uppercase}
.logo-tile:is(:hover,:focus-visible) .bg{opacity:1}
.logo-tile:is(:hover,:focus-visible) .bg img{transform:scale(1)}
.logo-tile:is(:hover,:focus-visible) .mark img,.logo-tile:is(:hover,:focus-visible) .mark b{opacity:1}
.logo-tile .meta{justify-content:flex-start}
.logo-tile .meta b{text-transform:uppercase;letter-spacing:.04em}
.logo-tile .meta .ptag{margin-left:10px;font-stretch:88%;font-size:12px;color:var(--ash)}

/* page heads (domain, brand) */
.page{padding-top:84px}
.head{padding:0 var(--pad)}
.head h1{margin:0;font-weight:600;font-stretch:68%;font-size:clamp(44px,7.2vw,120px);line-height:.92}
.head .sub{display:flex;justify-content:space-between;gap:16px;margin-top:12px;font-stretch:88%;font-size:14px;color:var(--ash)}
.head .sub a:hover{color:var(--bone)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(26px,3vw,44px) var(--gap);padding:clamp(28px,4vw,56px) var(--pad) 0}
.tile{display:block}
.tile .ph{aspect-ratio:4/3}
.tile .meta{display:flex;justify-content:space-between;gap:16px;padding-top:9px;font-stretch:88%;font-size:14px}
.tile .meta span:last-child{color:var(--ash);white-space:nowrap}
.tile .meta b{font-weight:500}

/* home: how I work (inline players) */
.how{padding:clamp(56px,7vw,100px) var(--pad) 0;margin-top:clamp(72px,9vw,140px);border-top:1px solid var(--rule);scroll-margin-top:60px}
.how-h{margin-bottom:22px}
.how-h h2{margin:0;font-family:'Syne',var(--sans);font-weight:600;font-size:clamp(26px,2.6vw,38px);line-height:1.1}
.how-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
.pv{position:relative;aspect-ratio:16/9;background:#0b0b0b;overflow:hidden}
.pv video{display:block;width:100%;height:100%;object-fit:cover;cursor:pointer}
.pv .lbl{position:absolute;top:16px;left:50%;transform:translateX(-50%);padding:8px 18px;background:rgba(11,11,11,.78);border:1px solid rgba(240,240,236,.22);font-family:'Syne',var(--sans);font-weight:600;font-size:clamp(15px,1.3vw,20px);white-space:nowrap;pointer-events:none;backdrop-filter:blur(6px);transition:opacity .3s ease}
.pv.on .lbl{opacity:0}
.pv .play{position:absolute;inset:0;margin:auto;width:76px;height:76px;border-radius:50%;border:1px solid rgba(240,240,236,.5);background:rgba(11,11,11,.55);color:var(--bone);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px);transition:transform .25s ease,border-color .25s ease}
.pv .play svg{width:28px;height:28px;margin-left:4px}
.pv .play:hover{transform:scale(1.06);border-color:var(--bone)}
.pv.on .play{opacity:0;pointer-events:none}
.pv .snd{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;gap:8px;min-height:38px;padding:0 12px;border:1px solid rgba(240,240,236,.35);background:rgba(11,11,11,.6);color:var(--bone);font:inherit;font-stretch:88%;font-size:13px;cursor:pointer;backdrop-filter:blur(6px)}
.pv .snd:hover{border-color:var(--bone)}
.pv .snd svg{width:16px;height:16px}
.pv:not(.on) .snd{opacity:0;pointer-events:none}
.how-c{aspect-ratio:16/9}
#pvBack{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;visibility:hidden;transition:opacity .4s ease,visibility .4s}
#pvBack.on{opacity:1;visibility:visible}
html.vlock{overflow:hidden}
.pv .x{position:absolute;top:12px;right:12px;width:40px;height:40px;border:1px solid rgba(240,240,236,.35);background:rgba(11,11,11,.6);color:var(--bone);font-size:16px;cursor:pointer;display:none;backdrop-filter:blur(6px)}
.pv .x:hover{border-color:var(--bone)}
.pv.big .x{display:grid;place-items:center}
.pv.big .play{opacity:1;pointer-events:auto}
.pv.big.on .play{opacity:0;pointer-events:none}
@media (max-width:640px){.how-g{grid-template-columns:1fr}.pv .snd span{display:none}}
/* domain tiles: hover lift */
.dom,.logo-tile,.tile{--rx:0deg;--ry:0deg;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.dom .ph{transition:box-shadow .4s ease}
@media (hover:hover){.dom:hover,.logo-tile:hover,.tile:hover{transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .18s ease-out}}
@media (prefers-reduced-motion:reduce){.dom,.logo-tile,.tile{transition:none}.dom:hover,.logo-tile:hover,.tile:hover{transform:none}}
/* hero: name, S·I·M, skills on photo hover */
.hero{display:grid;grid-template-columns:auto 1fr;gap:clamp(24px,3.5vw,56px);align-items:start;padding:clamp(110px,16svh,170px) var(--pad) clamp(24px,4svh,48px)}
.me{width:clamp(150px,14vw,220px);aspect-ratio:3/4;border:0;padding:0;background:#141414;cursor:pointer;position:relative;overflow:hidden;display:grid;place-items:center}
.me .ph-ph{font-stretch:88%;font-size:12px;letter-spacing:.2em;color:var(--ash)}
.me img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) brightness(.7);transition:filter .5s ease}
.hero.open .me img{filter:none}
.who{margin:-4px 0 10px;line-height:1;font-stretch:88%;font-size:15px;color:var(--bone)}.who span{color:var(--ash)}
.sim{margin:0;font-family:'Syne',var(--sans);font-weight:600;font-size:clamp(44px,7.2vw,124px);line-height:.95;letter-spacing:-.01em}
.sim{display:flex;flex-wrap:wrap;column-gap:clamp(28px,3.5vw,64px);row-gap:28px;font-size:clamp(40px,5.4vw,96px)}.sim .col{display:flex;flex-direction:column}.sim .w{white-space:nowrap}.sim .sk{display:grid;grid-template-columns:repeat(3,minmax(0,92px));column-gap:14px;row-gap:16px;align-items:start;margin-top:clamp(14px,2svh,22px);line-height:1.25;font-family:var(--sans);font-weight:400;font-stretch:88%;font-size:15px;line-height:1.7;letter-spacing:0;color:var(--ash)}
.sim .it{display:flex;flex-direction:column;gap:8px;font-size:13px}.sim .it svg{width:28px;height:28px;fill:none;stroke:var(--bone);stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round;opacity:.85}.sim i,.skills i{font-style:normal;color:#ff4d1a}
.skills{display:grid;grid-template-columns:repeat(3,max-content);gap:clamp(24px,4vw,72px);margin-top:clamp(18px,2.5svh,28px);min-height:9.5em}
.skills ul{list-style:none;margin:0;padding:0}
.skills li{font-stretch:88%;font-size:15px;line-height:1.75;color:var(--bone);opacity:0;transform:translateY(8px);transition:opacity .35s ease,transform .35s cubic-bezier(.2,.8,.2,1);transition-delay:0ms}
.skills li.g{font-family:'Syne',var(--sans);font-weight:600;font-size:17px;margin-bottom:4px;opacity:.55;transform:none}
.hero.open .skills li{opacity:1;transform:none;transition-delay:var(--d)}
.hero.open .skills li.g{opacity:1}
@media (min-width:900px){.hero.side{grid-template-columns:auto auto 1fr}.hero.side .hx{display:contents}.hero.side .hx>.who,.hero.side .hx>.sim{grid-column:2}.hero.side .who{grid-row:1}.hero.side .sim{grid-row:2;font-size:clamp(44px,5.6vw,100px)}.hero.side .me{grid-row:1 / span 3}.hero.side .skills{grid-column:3;grid-row:1 / span 3;justify-self:end;align-self:start;margin-top:0;min-height:0}}
@media (min-width:641px){.hero + .reel{height:auto;min-height:0;padding:clamp(110px,14svh,150px) 0 clamp(60px,8svh,100px)}}
.hero + .reel .cap{top:clamp(40px,5svh,64px)}
@media (hover:none){.skills li{opacity:1;transform:none}.skills li.g{opacity:1}.me img{filter:none}}
@media (max-width:640px){.hero{grid-template-columns:1fr;align-items:start;padding-top:96px}.me{width:46vw}.skills{grid-template-columns:1fr 1fr;row-gap:16px}}
@media (prefers-reduced-motion:reduce){.skills li{transition:none}}
/* S·I·M tool reveal */
.sim .col{position:relative}
.sim .w{all:unset;cursor:pointer;white-space:nowrap;position:relative;display:inline-block}
.sim .w em{font-style:normal;font-family:var(--sans);font-weight:300;font-size:.28em;vertical-align:top;margin-left:.12em;color:var(--ash);transition:transform .3s ease,color .3s ease;display:inline-block}
.sim .col.on .w em{transform:rotate(45deg);color:#ff4d1a}
.sim .w:focus-visible{outline:1px solid var(--bone);outline-offset:6px}
#simBack{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);opacity:0;visibility:hidden;transition:opacity .35s ease,visibility .35s}
#simBack.on{opacity:1;visibility:visible}
.sim .col.on{z-index:31}
.sim .tools{position:absolute;left:0;top:100%;padding-top:18px;display:flex;flex-direction:column;gap:12px;font-family:var(--sans);font-weight:400;letter-spacing:0;pointer-events:none;z-index:31}
.sim .col.on .tools{pointer-events:auto}
.sim .tl{display:flex;align-items:center;gap:14px;font-stretch:88%;font-size:17px;line-height:1;color:var(--bone);opacity:0;transform:translateY(10px);transition:opacity .3s ease,transform .35s cubic-bezier(.2,.8,.2,1);transition-delay:0ms;white-space:nowrap}
.sim .col.on .tl{opacity:1;transform:none;transition-delay:var(--d)}
.sim .tl svg{width:26px;height:26px;fill:var(--bone);flex:none}
.sim .tl .mono{width:26px;height:26px;display:grid;place-items:center;border:1.5px solid var(--bone);font:700 10px/1 var(--sans);letter-spacing:.02em;flex:none}
.sim .tl{position:relative}.sim .tl.ai0{margin-top:8px;padding-top:34px;border-top:1px solid rgba(240,240,236,.22)}
.sim .tl.ai0::before{content:'AI';position:absolute;top:12px;left:0;font-size:11px;letter-spacing:.14em;color:var(--ash)}
@media (prefers-reduced-motion:reduce){.sim .tl{transition:none}}
/* light theme */
html.light{--black:#f2f0eb;--bone:#161513;--ash:#6e6a62;--rule:#d8d4cb;color-scheme:light}
html.light img,html.light video{background:#e4e1da}
.bar{color:#ece8df}
html.light .logo-tile .ph{background:#e4e1da}
html.light .logo-tile .mark img{filter:invert(1)}
html.light .logo-tile:is(:hover,:focus-visible) .mark img{filter:none}
html.light .logo-tile:is(:hover,:focus-visible) .mark b{color:#ece8df}
html.light #simBack{background:rgba(242,240,235,.6)}
.pv{--bone:#ece8df}
html.light .me{background:#e4e1da}
html.light .reel .ph img,html.light .me img{filter:none}
.modewrap{position:fixed;top:14px;right:var(--pad);z-index:21;display:flex;align-items:center}
.modewrap .tip{position:absolute;right:calc(100% + 10px);top:50%;white-space:nowrap;padding:6px 10px;border-radius:6px;background:#ff4d1a;color:#fff;font-stretch:88%;font-size:12px;letter-spacing:.02em;transform:translateY(-50%);pointer-events:none;transition:opacity .4s ease}
.modewrap .tip.gone{opacity:0}
html:not(.mode-seen) .bar{padding-right:calc(var(--pad) + 160px)}.modewrap .mode{display:inline-flex;align-items:center}
.modewrap .mode .lb{display:none}
.modewrap .mode .trk{position:relative;width:40px;height:24px;border-radius:999px;background:#ff4d1a;transition:background .3s ease}
.modewrap .mode .kn{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.28),0 0 1px rgba(0,0,0,.2);transition:transform .32s cubic-bezier(.3,1.3,.5,1)}
html.light .modewrap .mode .trk{background:#ff4d1a}
html.light .modewrap .mode .kn{transform:translateX(16px)}
.modewrap .mode:active .kn{width:24px}html.light .modewrap .mode:active .kn{transform:translateX(12px)}
.hero{transition:filter .5s ease}
body.rz .hero{filter:blur(10px) brightness(.45)}
/* footer */
footer{margin-top:clamp(80px,12vw,180px);padding:28px var(--pad) 40px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;font-stretch:88%;font-size:14px}
footer .who{font-stretch:125%;font-weight:500}
footer .mail{border-bottom:1px solid var(--rule)}

/* case */
.case{height:100svh;display:flex;flex-direction:column;padding-top:60px}
.chead{padding:6px var(--pad) 0}
.chead h1{margin:0;font-weight:600;font-stretch:68%;font-size:clamp(34px,4.6vw,68px);line-height:.94}
.chead .sub{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-top:10px;font-stretch:88%;font-size:14px;color:var(--ash)}
.chead .sub a:hover{color:var(--bone)}
.tg{display:inline-flex;gap:16px}
.tg button{font-stretch:88%;font-size:14px;color:var(--ash);padding:2px 0;border-bottom:1px solid transparent}
.tg button[aria-pressed="true"]{color:var(--bone);border-color:var(--bone)}
.stage{position:relative;flex:1;min-height:0;margin:clamp(14px,1.6vw,22px) var(--pad) 0;user-select:none;-webkit-user-select:none}
.track{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.track .slide{flex:0 0 100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden}
.track .slide img{object-fit:cover;-webkit-user-drag:none}
.track .slide video{object-fit:contain;background:var(--black);animation:none}
.flow{position:relative;flex:1;min-height:0;margin-top:clamp(10px,1.4vw,20px);perspective:1100px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.flow .card{position:absolute;left:50%;top:50%;width:var(--cw);aspect-ratio:16/9;margin:calc(var(--cw) * -9 / 32) 0 0 calc(var(--cw) / -2);
  transition:transform .7s cubic-bezier(.16,1,.3,1),filter .7s cubic-bezier(.16,1,.3,1),opacity .7s;will-change:transform;cursor:pointer;background:#0b0b0b}
.flow .card img,.flow .card video{width:100%;height:100%;object-fit:cover;-webkit-user-drag:none;animation:none}
.flow .card.on{cursor:default}
.flow .card video{object-fit:contain;background:#000}
.flow{--cw:min(58vw,calc((100svh - 260px) * 16 / 9))}
.foot{display:flex;justify-content:flex-end;padding:10px var(--pad) 14px;font-stretch:88%;font-size:14px;color:var(--ash);font-variant-numeric:tabular-nums}

/* portrait screens: show the whole photo unless a vertical version exists */
@media (orientation:portrait){
  .track .slide img:not(.v){object-fit:contain;background:var(--black)}
  .flow{--cw:80vw}
}

@media (max-width:760px){
  .bar nav a.sec{display:none}
  .reel{--rh:44svh;height:auto;min-height:0;padding:96px 0 72px}
  .cap{display:none}
  .reel.m1{--rh:26svh}.reel.m2{--rh:20svh}.reel.m3{--rh:15svh}
  .domains{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dom .ph{aspect-ratio:4/5}
  .grid{grid-template-columns:1fr}
  .grid.logos{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chead h1{font-size:34px}
  .case{padding-top:54px}
}
@media (prefers-reduced-motion:reduce){
  .flow .card{transition:none}
  .dom .ph .sl,.logo-tile .bg,.logo-tile .bg img{transition:none}
  .dom .ph .sl.on img{animation:none}
  .cap,.reel .rows{transition:none}
  .zoom > img,.zoom > video{animation:none}
  .reel .item,.reel .ph img{transition:none}
}
</style>
</head>
<body>
<a class="skip" href="#view">Skip to work</a>
<header class="bar">
  <a class="name" href="#top">Eric Chen</a>
  <nav>
    <a href="#contact">Contact</a>

  </nav>
</header>
<div class="modewrap"><span class="tip" aria-live="polite"></span><button class="mode" type="button" role="switch" aria-checked="false" aria-label="Light mode" title="Dark / Light"><span class="lb">Dark</span><span class="trk"><span class="kn"></span></span><span class="lb">Light</span></button></div>

<main id="view"></main>

<footer id="contact">
  <span class="who">Eric Chen</span>
  <span>Taipei</span>
  <a class="mail" href="mailto:eric61003@me.com">eric61003@me.com</a>
</footer>

<script src="data.js"></script>
<script src="gsap.min.js"></script>
<script src="logos.js"></script>
<script>
const byId = Object.fromEntries(CASES.map(c => [c.id, c]));
const $v = document.getElementById('view'), $foot = document.getElementById('contact');
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const live = c => !c.proposal;
const inDom = (c, k) => k === 'ai' ? c.ai : c.dom === k;
const yr = s => { const m = String(s).match(/\d{4}/g); return m ? +m[m.length - 1] : 0; };
const coverOf = c => c.poster ? c.poster[0] : (c.site[0] || c.render[0]).f;
// media element for a tile: video cases preview as muted loops
const media = (c, eager) => c.video
  ? `<video muted loop playsinline autoplay preload="metadata" poster="${c.poster[0]}" src="${c.video[0]}"></video>`
  : `<img ${eager ? '' : 'loading="lazy"'} src="${coverOf(c)}" alt="${esc(c.title)}">`;

// brands per domain (proposals included, tagged)
function brands(dom) {
  const m = new Map();
  CASES.filter(c => inDom(c, dom)).forEach(c => {
    if (!m.has(c.brand)) m.set(c.brand, { key: c.brand, client: c.client, cases: [] });
    m.get(c.brand).cases.push(c);
  });
  const L = [...m.values()];
  L.forEach(b => {
    b.cases.sort((a, z) => yr(z.year) - yr(a.year));
    const ys = b.cases.flatMap(c => String(c.year).match(/\d{4}/g) || []).map(Number);
    b.lo = Math.min(...ys); b.hi = Math.max(...ys);
    b.range = ys.length ? (b.lo === b.hi ? `${b.hi}` : `${b.lo}–${b.hi}`) : '';
    const lead = HOME.brandLead[b.key];
    b.lead = b.cases.find(c => c.id === lead) || b.cases[0];
  });
  // archive always last, otherwise newest first
  return L.sort((a, z) => (a.key === 'archive') - (z.key === 'archive') || z.hi - a.hi);
}

/* ---------- home ---------- */
let reelTween = null, reelPaused = false, domTimers = [];
function reelItem(c) {
  const f = c.poster ? null : (c.site[0] || c.render[0]);
  const ar = 1.5;  // every photo cropped to 3:2
  return `<a class="item" href="#${c.id}" style="--ar:${ar.toFixed(3)}" aria-label="${esc(c.title)}, ${esc(c.year)}">
    <div class="ph"><img src="${coverOf(c)}" alt="${esc(c.title)}" ${f ? `width="${f.w}" height="${f.h}"` : ''} draggable="false"></div>
  </a>`;
}
function renderHome() {
  const H = HOME.hero.map(id => byId[id]).filter(Boolean);
  const doms = Object.entries(HOME.domains).map(([k, d]) => {
    const c = byId[d.cover];
    const pool = k === 'ai' ? CASES.filter(x => x.ai && live(x)) : brands(k).map(b => b.lead);
    const slides = [c, ...pool.filter(x => x.id !== c.id)].slice(0, 8);
    return `<a class="dom" href="#${k}" aria-label="${esc(d.name)}"><div class="ph">${slides.map((x, i) => `<div class="sl${i ? '' : ' on'}"><img ${i ? 'loading="lazy"' : ''} src="${coverOf(x)}" alt=""></div>`).join('')}</div>
      <div class="t"><b>${esc(d.name)}</b></div></a>`;
  }).join('');
  const M = new URLSearchParams(location.search).get('m') || HOME.reelMode || '1';
  // pool: the picks first, then other built work (no archive), newest first
  const rest = CASES.filter(c => live(c) && c.brand !== 'archive' && !HOME.hero.includes(c.id)).sort((a, z) => yr(z.year) - yr(a.year));
  const pool = [...H, ...rest];
  const rowsData = HOME.reelRows ? HOME.reelRows.map(r => r.map(id => byId[id]).filter(Boolean)) : M === '3' ? [pool.slice(0, 13), pool.slice(13, 26), pool.slice(26, 39)] : M === '2' ? [pool.slice(0, 14), pool.slice(14, 28)] : [pool.slice(0, 18)];
  $v.innerHTML = `
    <section class="hero" aria-label="About">
      <button class="me" type="button" aria-expanded="false" aria-label="Eric Chen"><img src="img/me.jpg" alt="Eric Chen"></button>
      <div class="hx">
        <p class="who">Eric Chen <span>— Taipei</span></p>
        <h1 class="sim">${SIM.map(([w,tr,ai],gi) => `<span class="col" data-g="${gi}"><button class="w" type="button" aria-expanded="false"><i>${w[0]}</i>${w.slice(1)}.<em aria-hidden="true">+</em></button><span class="tools" role="list">${[...tr.map(t => [t,0]), ...ai.map(t => [t,1])].map(([t,isAi],k) => `<span class="tl${isAi && (k === tr.length) ? ' ai0' : ''}" role="listitem" style="--d:${k*60}ms">${TOOL(t)}<span>${t}</span></span>`).join('')}</span></span>`).join(' ')}</h1>
      </div>
    </section>
    <section class="reel m${HOME.reelRows ? HOME.reelRows.length : M}" id="reel" aria-label="Selected work">
      <div class="rows">${rowsData.map((r, i) => {
        const set = r.map(reelItem).join('');
        return `<div class="row" data-dir="${i % 2 ? 1 : -1}">${set}<div class="dup" style="display:contents" aria-hidden="true">${set}</div></div>`;
      }).join('')}</div>
      <div class="cap" id="reelCap" aria-hidden="true"><b></b><span></span></div>
      <a class="zoomer" id="reelZoom" href="#" tabindex="-1" aria-hidden="true"></a>
      <button type="button" class="pause" id="reelPause" aria-pressed="false">Pause</button>
    </section>
    <div class="domains" id="work">${doms}</div>
    <section class="how" id="how"><div class="how-h"><h2>How I work</h2></div>
      <div class="how-g">${[['process-spatial','Spatial Design'],['process-aifilm','AI Film & Image']].map(([f,t]) => `<div class="how-c"><div class="pv"><video src="vid/${f}.mp4" poster="vid/${f}.jpg" loop playsinline preload="none"></video>
        <div class="lbl">${t}</div>
        <button class="play" type="button" aria-label="Play ${t}"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></button>
        <button class="snd" type="button" aria-pressed="true">${SPK_ON}<span>Sound on</span></button>
        <button class="x" type="button" aria-label="Close">✕</button></div></div>`).join('')}</div></section>`;
  document.querySelectorAll('#reel .dup a').forEach(a => { a.tabIndex = -1; });
  // each domain picture cycles through its brands, the two out of step
  { const hero = $v.querySelector('.hero'), me = hero.querySelector('.me'), hov = matchMedia('(hover: hover)').matches;
    if (hov) { me.addEventListener('mouseenter', () => hero.classList.add('open')); me.addEventListener('mouseleave', () => hero.classList.remove('open')); }
    let sb = document.getElementById('simBack'); if (!sb) { sb = document.createElement('div'); sb.id = 'simBack'; document.body.appendChild(sb); }
    const cols = [...hero.querySelectorAll('.sim .col')];
    const close = () => { cols.forEach(c => { c.classList.remove('on'); c.querySelector('.w').setAttribute('aria-expanded','false'); }); sb.classList.remove('on'); };
    const open = c => { close(); c.classList.add('on'); c.querySelector('.w').setAttribute('aria-expanded','true'); sb.classList.add('on'); };
    cols.forEach(c => { const w = c.querySelector('.w');
      if (hov) { w.addEventListener('mouseenter', () => open(c)); c.addEventListener('mouseleave', close); }
      w.addEventListener('click', () => c.classList.contains('on') ? close() : open(c)); });
    sb.onclick = close; }
  bindPlayers($v.querySelector('.how'));
  if (!reduce) document.querySelectorAll('.dom .ph').forEach((ph, j) => {
    const sl = ph.querySelectorAll('.sl'); let i = 0;
    if (sl.length < 2) return;
    setTimeout(() => { domTimers.push(setInterval(() => { sl[i].classList.remove('on'); i = (i + 1) % sl.length; sl[i].classList.add('on'); }, 3600)); }, j * 600);
  });
  // the title and year show only while the pointer (or keyboard focus) is on a photo
  const $cap = document.getElementById('reelCap');
  const showCap = a => { const c = byId[a.getAttribute('href').slice(1)]; if (!c) return;
    $cap.querySelector('b').textContent = c.title; $cap.querySelector('span').textContent = c.year; $cap.classList.add('on'); };
  const $reel = document.getElementById('reel'), $z = document.getElementById('reelZoom');
  let zTimer = null, zFrom = null, zShow = null;
  const grow = a => {
    if (reduce || !matchMedia('(hover: hover)').matches) return;
    const img = a.querySelector('img'), r = img.getBoundingClientRect();
    const ar = img.naturalWidth && img.naturalHeight ? img.naturalWidth / img.naturalHeight : r.width / r.height;
    const maxW = innerWidth * .84, maxH = innerHeight * .74;
    let w = maxW, h = w / ar; if (h > maxH) { h = maxH; w = h * ar; }
    zFrom = { left: r.left, top: r.top, width: r.width, height: r.height };
    // the big view runs through the project's own photos, starting from the one in the wall
    const c = byId[a.getAttribute('href').slice(1)];
    const set = c ? (c.site.length ? c.site : c.render).map(x => x.f) : [];
    const srcs = [img.getAttribute('src'), ...set.filter(f => f !== img.getAttribute('src'))].slice(0, 8);
    $z.innerHTML = srcs.map((f, i) => `<img src="${f}" alt="" class="${i ? '' : 'on'}" ${i ? 'loading="lazy"' : ''}>`).join('');
    $z.href = a.getAttribute('href');
    clearInterval(zShow);
    if (srcs.length > 1) {
      let i = 0; const ims = $z.querySelectorAll('img');
      zShow = setInterval(() => { ims[i].classList.remove('on'); i = (i + 1) % ims.length; ims[i].classList.add('on'); }, 2600);
    }
    gsap.killTweensOf($z);
    gsap.set($z, { ...zFrom, autoAlpha: 1 });
    gsap.to($z, { left: (innerWidth - w) / 2, top: (innerHeight - h) / 2 + 24, width: w, height: h, duration: .7, ease: 'power3.out' });
    { const ty = (innerHeight - h) / 2 + 24, cr = $cap.getBoundingClientRect();
      gsap.killTweensOf($cap); gsap.set($cap, { position: 'fixed', top: cr.top, zIndex: 7 });
      gsap.to($cap, { top: Math.max(56, ty - cr.height - 14), duration: .7, ease: 'power3.out' }); }
    $reel.classList.add('zoomed'); document.body.classList.add('rz');
  };
  const shrink = () => {
    clearTimeout(zTimer); zTimer = null; clearInterval(zShow); zShow = null;
    const ims = $z.querySelectorAll('img'); ims.forEach((m, i) => m.classList.toggle('on', i === 0));
    $reel.classList.remove('zoomed'); document.body.classList.remove('rz');
    gsap.killTweensOf($cap); gsap.set($cap, { clearProps: 'position,top,zIndex' });
    if (!zFrom) return;
    gsap.killTweensOf($z);
    gsap.to($z, { ...zFrom, duration: .45, ease: 'power3.inOut', onComplete: () => gsap.set($z, { autoAlpha: 0 }) });
    zFrom = null;
  };
  $z.addEventListener('mouseleave', e => {
    $cap.classList.remove('on'); shrink();
    if (!(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('#reel .row'))) { reelHold = false; reelEase(1); }
  });
  document.querySelectorAll('#reel .item').forEach(a => {
    a.addEventListener('mouseenter', () => { showCap(a); clearTimeout(zTimer); zTimer = setTimeout(() => grow(a), 1500); });
    a.addEventListener('mouseleave', e => { if (e.relatedTarget && $z.contains(e.relatedTarget)) return; $cap.classList.remove('on'); shrink(); });
    a.addEventListener('focus', () => showCap(a));
    a.addEventListener('blur', () => $cap.classList.remove('on'));
  });
  startReel();
}
let reelHold = false, reelTweens = [];
function reelEase(to, d) {
  const target = reelPaused || reduce || reelHold ? 0 : to;
  reelTweens.forEach(t => gsap.to(t, { timeScale: target, duration: d ?? (target ? .9 : .5), ease: 'power3.out', overwrite: true }));
}
function startReel() {
  const $r = document.getElementById('reel'), $p = document.getElementById('reelPause');
  if (!$r || !window.gsap) return;
  const prev = reelTweens.map(t => t.progress());
  reelTweens.forEach(t => t.kill());
  reelTweens = [...$r.querySelectorAll('.row')].map((row, i) => {
    const items = row.querySelectorAll('.item');
    const half = items[items.length / 2].offsetLeft - items[0].offsetLeft;
    const dir = +row.dataset.dir;
    gsap.set(row, { x: dir < 0 ? 0 : -half });
    const t = gsap.to(row, { x: dir < 0 ? -half : 0, duration: half / 38, ease: 'none', repeat: -1 });
    t.progress(prev[i] || 0);
    t.timeScale(reelPaused || reduce || reelHold ? 0 : 1);
    return t;
  });
  reelTween = reelTweens[0];
  if (!$r.dataset.bound) {
    $r.dataset.bound = '1';
    const hold = v => { reelHold = v; reelEase(1); };
    $r.querySelectorAll('.row').forEach(row => {
      row.addEventListener('mouseenter', () => hold(true));
      row.addEventListener('mouseleave', e => { const t = e.relatedTarget; if (!t || !t.closest || !(t.closest('#reel .row') || t.closest('#reelZoom'))) hold(false); });
      row.addEventListener('touchstart', () => hold(true), { passive: true });
      row.addEventListener('touchend', () => setTimeout(() => hold(false), 1200), { passive: true });
    });
    $r.addEventListener('focusin', e => { if (e.target.closest('.item')) hold(true); });
    $r.addEventListener('focusout', e => { if (!$r.contains(e.relatedTarget)) hold(false); });
    $p.onclick = () => {
      reelPaused = !reelPaused; reelEase(1, .5);
      $p.textContent = reelPaused ? 'Play' : 'Pause';
      $p.setAttribute('aria-pressed', String(reelPaused));
    };
    const pending = [...$r.querySelectorAll('img')].filter(i => !i.complete);
    if (pending.length) Promise.all(pending.map(i => new Promise(r => { i.addEventListener('load', r); i.addEventListener('error', r); })))
      .then(() => { if (document.getElementById('reel') === $r) startReel(); });
  }
  $p.textContent = reelPaused || reduce ? 'Play' : 'Pause';
  $p.setAttribute('aria-pressed', String(reelPaused || reduce));
}
let rT;
addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { if (document.getElementById('reel')) startReel(); }, 200); });

/* ---------- domain: list brands ---------- */
const logoMark = c => `<span class="mk">${LOGOS[c.brand] ? `<img src="${LOGOS[c.brand].src}" alt="" style="${LOGO_FILTER[c.brand] ? `filter:${LOGO_FILTER[c.brand]}` : ''}">` : `<b>${esc(c.client)}</b>`}</span>`;
// equal visual weight: logos are pre-trimmed white PNGs; width grows with the square root of their aspect ratio
// thin emblems read light at equal area, so they get a little more
const LOGO_BOOST = { ferrari: 1.4, maserati: 1.4, manhan: 1.3 };
const logoW = (ar, k) => Math.min(64, 22 * Math.sqrt(ar) * (LOGO_BOOST[k] || 1)).toFixed(1);
const LOGO_FILTER = { oralb: 'grayscale(1) brightness(1.4)', manhan: 'grayscale(1) brightness(1.4)', casetify: 'grayscale(1) invert(1)' };
function renderDomain(k) {
  const d = HOME.domains[k];
  const L = brands(k);
  $v.innerHTML = `<div class="page">
    <div class="head"><h1>${esc(d.name)}</h1><div class="sub"><span>${L.length} clients</span><a href="#top">Home</a></div></div>
    <div class="grid logos">${L.map(b => `<a class="tile logo-tile" href="#${b.cases.length > 1 ? `brand-${k}-${b.key}` : b.cases[0].id}" aria-label="${esc(b.client)}">
      <div class="ph"><div class="bg"><img loading="lazy" src="${coverOf(b.lead)}" alt=""></div>
        <div class="mark">${LOGOS[b.key] ? `<img src="${LOGOS[b.key].src}" alt="" style="width:${logoW(LOGOS[b.key].ar, b.key)}%">` : `<b>${esc(b.client)}</b>`}</div></div>
      <div class="meta"><b>${esc(b.client)}</b>${b.cases.every(c => c.proposal) ? '<span class="ptag">Proposal</span>' : ''}</div></a>`).join('')}</div></div>`;
}

/* ---------- brand: list projects ---------- */
function renderBrand(k, key) {
  const b = brands(k).find(x => x.key === key);
  if (!b) return renderDomain(k);
  $v.innerHTML = `<div class="page">
    <div class="head"><h1>${esc(b.client)}</h1><div class="sub"><span>${b.range}</span><a href="#${k}">${esc(HOME.domains[k].name)}</a></div></div>
    <div class="grid">${b.cases.map(c => `<a class="tile" href="#${c.id}"><div class="ph zoom">${media(c)}</div>
      <div class="meta"><b>${esc(c.title)}</b><span>${esc(c.year)}${c.proposal ? ' · Proposal' : ''}</span></div></a>`).join('')}</div></div>`;
}

/* ---------- proposals ---------- */
function renderProposals() {
  const L = CASES.filter(c => c.proposal).sort((a, z) => yr(z.year) - yr(a.year));
  $v.innerHTML = `<div class="page">
    <div class="head"><h1>Proposals</h1><div class="sub"><span>Unbuilt concepts, ${L.length} projects</span><a href="#top">Home</a></div></div>
    <div class="grid">${L.map(c => `<a class="tile" href="#${c.id}"><div class="ph zoom">${media(c)}</div>
      <div class="meta"><b>${esc(c.title)}</b><span>${esc(c.year)}</span></div></a>`).join('')}</div></div>`;
}

/* ---------- domain tiles: tilt toward the pointer ---------- */
if (!reduce && matchMedia('(hover: hover)').matches) {
  let tiltEl = null;
  const untilt = el => { el.style.setProperty('--rx', '0deg'); el.style.setProperty('--ry', '0deg'); };
  document.addEventListener('pointermove', e => {
    const d = e.target.closest ? e.target.closest('.dom, .logo-tile, .tile') : null;
    if (tiltEl && tiltEl !== d) untilt(tiltEl);
    tiltEl = d; if (!d) return;
    const r = d.getBoundingClientRect(), px = (e.clientX - r.left) / r.width - .5, py = (e.clientY - r.top) / r.height - .5;
    d.style.setProperty('--ry', (px * 20).toFixed(2) + 'deg'); d.style.setProperty('--rx', (-py * 20).toFixed(2) + 'deg');
  }, { passive: true });
  document.addEventListener('pointerleave', () => { if (tiltEl) untilt(tiltEl); tiltEl = null; });

  const both = c.site.length && c.render.length;
  const first = c.site.length ? 'site' : 'render';
  let view = first;
  const [bh, bl] = backOf(c);
  $v.innerHTML = `<div class="case">
    <header class="chead"><h1>${esc(c.title)}</h1>
      <div class="sub"><span>${esc(c.client)}, ${esc(c.year)}, ${esc(c.type)}${c.proposal ? ', Proposal' : ''}</span>
        <span class="tg">${both ? `<button type="button" data-view="site" aria-pressed="true">On site</button><button type="button" data-view="render" aria-pressed="false">Render</button>` : ''}<a href="${bh}">${esc(bl)}</a></span></div></header>
    <div class="flow" id="flow" aria-roledescription="carousel"></div>
    <div class="foot"><span id="count" aria-live="polite"></span></div></div>`;
  const $f = document.getElementById('flow'), $count = document.getElementById('count');
  let cards = [], idx = 0;
  const paint = () => {
    const vids = view === first ? (c.video || []).map((v, i) => ({ v, p: c.poster[i] })) : [];
    const imgs = c[view].map(x => ({ f: x.f }));
    const items = [...vids, ...imgs];
    $f.innerHTML = items.map((x, i) => `<div class="card" data-i="${i}">${x.v
      ? `<video muted loop playsinline controls preload="${i ? 'none' : 'auto'}" ${x.p ? `poster="${x.p}"` : ''} src="${x.v}"></video>`
      : `<img ${i < 3 ? '' : 'loading="lazy"'} src="${x.f}" alt="${esc(c.title)} ${i + 1}" draggable="false">`}</div>`).join('');
    cards = [...$f.querySelectorAll('.card')]; idx = 0; layout();
  };
  // cover flow: the current photo flat in the middle, the others turned away, darker and softer the further they are
  const layout = () => {
    const cw = cards[0] ? cards[0].offsetWidth : 0;
    cards.forEach((el, i) => {
      const d = i - idx, a = Math.abs(d), sgn = Math.sign(d);
      if (!d) { el.style.transform = 'translate3d(0,0,0)'; el.style.filter = 'none'; el.style.opacity = 1; el.style.zIndex = 50; el.classList.add('on'); }
      else {
        const x = sgn * (cw * .5 + (a - 1) * cw * .13);
        el.style.transform = `translate3d(${x}px,0,${-320 - a * 40}px) rotateY(${-sgn * 64}deg)`;
        el.style.filter = `brightness(${Math.max(.18, .42 - (a - 1) * .08)}) blur(${Math.min(6, 2 + a)}px)`;
        el.style.opacity = a > 5 ? 0 : 1; el.style.zIndex = 50 - a; el.classList.remove('on');
      }
      const v = el.querySelector('video'); if (v) { if (d) v.pause(); else v.play().catch(() => {}); }
    });
    $count.textContent = cards.length > 1 ? `${idx + 1} / ${cards.length}` : '';
  };
  const go = t => { t = Math.max(0, Math.min(cards.length - 1, t)); if (t !== idx) { idx = t; layout(); } };
  $f.addEventListener('click', e => { const card = e.target.closest('.card'); if (card && !card.classList.contains('on')) go(+card.dataset.i); });
  // swipe / drag
  let x0 = null;
  $f.addEventListener('pointerdown', e => { if (e.target.closest('video')) return; x0 = e.clientX; });
  $f.addEventListener('pointerup', e => { if (x0 === null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 40) go(idx + (dx < 0 ? 1 : -1)); });
  $f.addEventListener('pointercancel', () => { x0 = null; });
  $v.querySelectorAll('[data-view]').forEach(b => b.onclick = () => {
    if (b.dataset.view === view) return;
    view = b.dataset.view;
    $v.querySelectorAll('[data-view]').forEach(x => x.setAttribute('aria-pressed', x === b));
    paint();
  });
  paint();
  viewer = { go: d => go(idx + d), back: bh, resize: layout };
}
addEventListener('keydown', e => {
  if (!viewer || e.altKey || e.metaKey || e.ctrlKey) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); viewer.go(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); viewer.go(-1); }
  else if (e.key === 'Escape') location.hash = viewer.back.slice(1);
});
addEventListener('resize', () => viewer && viewer.resize());

/* ---------- routing ---------- */
const homeScroll = { y: 0 };
let lastWasHome = false;
function route() {
  const id = location.hash.slice(1);
  if (lastWasHome) homeScroll.y = scrollY;
  domTimers.forEach(clearInterval); domTimers = []; reelTweens.forEach(t => t.kill()); reelTweens = []; if (window.gsap) gsap.killTweensOf('#reelZoom'); reelTween = null; reelHold = false; viewer = null;
  const c = byId[id];
  const lock = !!c;
  document.documentElement.classList.toggle('lock', lock);
  $foot.hidden = lock;
  lastWasHome = false;
  if (c) { renderCase(c); document.title = `${c.title} — Eric Chen`; scrollTo(0, 0); return; }
  if (HOME.domains[id]) { renderDomain(id); document.title = `${HOME.domains[id].name} — Eric Chen`; scrollTo(0, 0); return; }
  const bm = id.match(/^brand-([a-z]+)-(.+)$/);
  if (bm && HOME.domains[bm[1]]) { renderBrand(bm[1], bm[2]); document.title = 'Eric Chen — Portfolio'; scrollTo(0, 0); return; }
  if (id === 'proposals') { location.replace('#work'); return; }
  renderHome(); lastWasHome = true; document.title = 'Eric Chen — Portfolio';
  if (id === 'contact') $foot.scrollIntoView(); else if (id === 'work') document.getElementById('work').scrollIntoView(); else if (id === 'how' || id === 'process') document.getElementById('how').scrollIntoView(); else scrollTo(0, id === 'top' || !id ? 0 : homeScroll.y);
}
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
